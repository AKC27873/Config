##### PREFIX & KEYBINDINGS #####

# Change prefix from C-b to C-x
unbind C-b
set -g prefix C-x
bind C-x send-prefix

# Split panes (keep current path)
bind v split-window -h -c "#{pane_current_path}"
bind h split-window -v -c "#{pane_current_path}"
unbind '"'
unbind '%'

# New window in same path
bind c new-window -c "#{pane_current_path}"

# Reload config
bind r source-file ~/.tmux.conf \; display-message "Reloaded ~/.tmux.conf"

# Pane navigation with Alt + hjkl
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

##### COPY / PASTE SETTINGS #####

# Vi style copy mode
setw -g mode-keys vi
unbind ]
bind [ copy-mode

# Vi copy mode bindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -i -selection clipboard"
bind-key -T copy-mode-vi Y send-keys -X copy-end-of-line

bind P paste-buffer


##### TERMINAL #####################################################
set -g mouse on
set -g status-position top
set -g status-interval 1
set -g renumber-windows on
set-option -g automatic-rename off
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

##### Color and Status Bar #####################################################
source-file "~/.config/tmux/plugins/tmux-themepack/basic.tmuxtheme"

# ONEDARK STATUS BAR - BLACK BACKGROUND
set -g status-style "fg=#ABB2BF,bg=#000000"

# Left and right sections
set -g status-left-style "fg=#98C379,bg=#000000"
set -g status-right-style "fg=#ABB2BF,bg=#000000"

# Inactive windows
set -g window-status-style "fg=#5C6370,bg=#000000"

# Active window - OneDark red
set -g window-status-current-style "fg=#000000,bg=#E06C75,bold"

# Previously active window
set -g window-status-last-style "fg=#ABB2BF,bg=#000000"

# Activity and alerts
set -g window-status-activity-style "fg=#E5C07B,bg=#000000,bold"
set -g window-status-bell-style "fg=#000000,bg=#E06C75,bold"

# Window separators
set -g window-status-separator " #[fg=#5C6370]│#[default] "

# Window chooser - OneDark green
set -g mode-style "fg=#000000,bg=#98C379,bold"

# Copy-mode selection
set -g copy-mode-selection-style "fg=#ABB2BF,bg=#3E4451"


##### PLUGINS ######################################################
set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-yank"
##### TPM — KEEP LAST ###############################################
run '~/.tmux/plugins/tpm/tpm'
