##### PREFIX & KEYBINDINGS #####

# Change prefix from C-b to C-x
unbind C-b
set -g prefix C-x
bind C-x send-prefix

# Split panes (keep current path)
bind v split-window -h -c "#{pane_current_path}"
bind h split-window -v -c "#{pane_current_path}"
unbind '"'
unbind '%'

# New window in same path
bind c new-window -c "#{pane_current_path}"

# Reload config
bind r source-file ~/.tmux.conf \; display-message "Reloaded ~/.tmux.conf"

# Pane navigation with Alt + hjkl
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

##### COPY / PASTE SETTINGS #####

# Vi style copy mode
setw -g mode-keys vi
unbind ]
bind [ copy-mode

# Vi copy mode bindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -i -selection clipboard"
bind-key -T copy-mode-vi Y send-keys -X copy-end-of-line

bind P paste-buffer


##### TERMINAL #####################################################
set -g mouse on
set -g status on
set -g status-position top
set -g status-interval 1
set -g renumber-windows on
set-option -g automatic-rename off
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
# --- Catppuccin Mocha muted status bar overrides ---
set -g status-style 'bg=#1E1E2E,fg=#CDD6F4'

# Left side: session name + hostname
set -g status-left '#[fg=#CBA6F7,bold] #S #[fg=#585B70]│ #[fg=#CDD6F4]#H #[fg=#585B70]│ '
set -g status-left-length 40

# Right side: muted clock and date
set -g status-right '#[fg=#CBA6F7,bold]#{?window_zoomed_flag, Zoomed ,}#[default]#[fg=#585B70]│ #[fg=#CDD6F4]%H:%M:%S #[fg=#585B70]│ #[fg=#89B4FA]%Y-%m-%d '

# Inactive windows: subdued gray
setw -g window-status-style 'fg=#6C7086,bg=#1E1E2E'
setw -g window-status-format ' #I:#W '

# Active window: subtle blue-gray
setw -g window-status-current-style 'fg=#CDD6F4,bg=#313244,bold'
setw -g window-status-current-format ' #I:#W '

# Subtle pane borders
set -g pane-border-style 'fg=#313244'
set -g pane-active-border-style 'fg=#89B4FA'

# Transparent-looking selection with bold text
set -g mode-style 'fg=#CBA6F7,bg=default,bold'

# Copy-mode cursor
set -g copy-mode-match-style 'fg=#89B4FA,bg=default,bold'
set -g copy-mode-current-match-style 'fg=#F9E2AF,bg=default,bold'
##### PLUGINS ######################################################
set -g @plugin 'catppuccin/tmux'
set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-yank"
##### TPM — KEEP LAST ###############################################
run '~/.tmux/plugins/tpm/tpm'
