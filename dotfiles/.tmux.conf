##### PREFIX & KEYBINDINGS #####

# Change prefix from C-b to C-x
unbind C-b
set -g prefix C-x
bind C-x send-prefix

# Split panes (keep current path)
bind v split-window -h -c "#{pane_current_path}"
bind h split-window -v -c "#{pane_current_path}"
unbind '"'
unbind '%'

# New window in same path
bind c new-window -c "#{pane_current_path}"

# Reload config
bind r source-file ~/.tmux.conf \; display-message "Reloaded ~/.tmux.conf"

# Pane navigation with Alt + hjkl
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

##### COPY / PASTE SETTINGS #####

# Vi style copy mode
setw -g mode-keys vi
unbind ]
bind [ copy-mode

# Vi copy mode bindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -i -selection clipboard"
bind-key -T copy-mode-vi Y send-keys -X copy-end-of-line

bind P paste-buffer

##### PLUGINS & CATPPUCCIN #####

# TPM Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-dir '~/.tmux/resurrect'
set -g @plugin 'catppuccin'
set -g @plugin 'tmux-plugins/tpm'
set -g @catppuccin_flavor 'mocha' # latte, frappe, macchiato or mocha

##### BEHAVIOR & UI #####

# General options
set-option -g allow-rename off
set-option -g automatic-rename off
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:Tc"
set -g status-position top
set -g renumber-windows on
set-window-option -g status-position top

set -g @catppuccin_window_status_style "rounded"

# Load catppuccin
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_text "#W"
set -g @catppuccin_window_current_text "#W"   
# Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -agF status-right "#{E:@catppuccin_status_ram}"
set -ag status-left "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
set -agF status-right "#{E:@catppuccin_status_battery}"


# Initialize TPM (keep at bottom)
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux
# source-file "~/.config/tmux/plugins/tmux-themepack/basic.tmuxtheme"
run '~/.tmux/plugins/tpm/tpm'
bind-key C-r run-shell ~/.tmux/plugins/tmux-resurrect/scripts/restore.sh
bind-key C-s run-shell ~/.tmux/plugins/tmux-resurrect/scripts/save.sh
