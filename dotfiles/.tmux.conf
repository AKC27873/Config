##### PREFIX & KEYBINDINGS #####

# Change prefix from C-b to C-x
unbind C-b
set -g prefix C-x
bind C-x send-prefix

# Split panes (keep current path)
bind v split-window -h -c "#{pane_current_path}"
bind h split-window -v -c "#{pane_current_path}"
unbind '"'
unbind '%'

# New window in same path
bind c new-window -c "#{pane_current_path}"

# Reload config
bind r source-file ~/.tmux.conf \; display-message "Reloaded ~/.tmux.conf"

# Pane navigation with Alt + hjkl
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

##### COPY / PASTE SETTINGS #####

# Vi style copy mode
setw -g mode-keys vi
unbind ]
bind [ copy-mode

# Vi copy mode bindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -i -selection clipboard"
bind-key -T copy-mode-vi Y send-keys -X copy-end-of-line

bind P paste-buffer

##### TERMINAL #####################################################

# True-color support
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:Tc"

# Faster and more responsive
set -sg escape-time 10
set -g focus-events on
set -g history-limit 100000

# Clipboard and mouse support
set -g mouse on
set -g set-clipboard on


##### WINDOWS & PANES ##############################################

# Prevent programs from changing window names
setw -g allow-rename off
setw -g automatic-rename off

# Keep window numbering clean
set -g renumber-windows on

# Keep tmux alive when the active session is destroyed
set -g detach-on-destroy off


##### STATUS BAR ###################################################

set -g status-position top
set -g status-interval 5
set -g status-left-length 40
set -g status-right-length 120


##### KEYBINDINGS ##################################################

# Prefix + r reloads the configuration
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"


##### TPM PLUGINS ##################################################

set -g @plugin "tmux-plugins/tpm"


# Utilities
set -g @plugin "tmux-plugins/tmux-yank"
set -g @plugin "tmux-plugins/tmux-resurrect"

# Required by Catppuccin CPU, RAM, and battery modules
set -g @plugin "tmux-plugins/tmux-cpu"
set -g @plugin "tmux-plugins/tmux-battery"


##### TMUX RESURRECT ###############################################

set -g @resurrect-dir "~/.local/share/tmux/resurrect"

# Restore Neovim sessions when available
set -g @resurrect-strategy-nvim "session"


##### INITIALIZE TPM ################################################
# This must remain at the bottom of the configuration.

run "~/.tmux/plugins/tpm/tpm"

# Initialize TPM (keep at bottom)
source-file "~/.config/tmux/plugins/tmux-themepack/basic.tmuxtheme"
run '~/.tmux/plugins/tpm/tpm'
bind-key C-r run-shell ~/.tmux/plugins/tmux-resurrect/scripts/restore.sh
bind-key C-s run-shell ~/.tmux/plugins/tmux-resurrect/scripts/save.sh

