##### PREFIX & KEYBINDINGS #####

# Change prefix from C-b to C-x
unbind C-b
set -g prefix C-x
bind C-x send-prefix

# Split panes (keep current path)
bind v split-window -h -c "#{pane_current_path}"
bind h split-window -v -c "#{pane_current_path}"
unbind '"'
unbind '%'

# New window in same path
bind c new-window -c "#{pane_current_path}"

# Reload config
bind r source-file ~/.tmux.conf \; display-message "Reloaded ~/.tmux.conf"

# Pane navigation with Alt + hjkl
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

##### COPY / PASTE SETTINGS #####

# Vi style copy mode
setw -g mode-keys vi
unbind ]
bind [ copy-mode

# Vi copy mode bindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -i -selection clipboard"
bind-key -T copy-mode-vi Y send-keys -X copy-end-of-line

bind P paste-buffer


##### TERMINAL #####################################################
set -g mouse on
set -g status on
set -g status-position top
set -g status-interval 1
set -g renumber-windows on
set-option -g automatic-rename off
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# --- Dracula muted status bar ---

# Status bar
set -g status-style 'bg=#282A36,fg=#F8F8F2'

# Left side: session name + hostname
set -g status-left '#[fg=#BD93F9,bold] #S #[fg=#6272A4]│ #[fg=#F8F8F2]#H #[fg=#6272A4]│ '
set -g status-left-length 40

# Right side: muted clock and date
set -g status-right '#[fg=#BD93F9,bold]#{?window_zoomed_flag, Zoomed ,}#[default]#[fg=#6272A4]│ #[fg=#F8F8F2]%H:%M:%S #[fg=#6272A4]│ #[fg=#8BE9FD]%Y-%m-%d '

# Inactive windows: subdued blue-gray
setw -g window-status-style 'fg=#6272A4,bg=#282A36'
setw -g window-status-format ' #I:#W '

# Active window: subtle Dracula selection
setw -g window-status-current-style 'fg=#F8F8F2,bg=#44475A,bold'
setw -g window-status-current-format ' #I:#W '

# Subtle pane borders
set -g pane-border-style 'fg=#44475A'
set -g pane-active-border-style 'fg=#BD93F9'

# Transparent-looking selection with bold text
set -g mode-style 'fg=#BD93F9,bg=default,bold'

# Copy-mode cursor
set -g copy-mode-match-style 'fg=#8BE9FD,bg=default,bold'
set -g copy-mode-current-match-style 'fg=#F1FA8C,bg=default,bold'
##### PLUGINS ######################################################
set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-yank"
##### TPM — KEEP LAST ###############################################
run '~/.tmux/plugins/tpm/tpm'
