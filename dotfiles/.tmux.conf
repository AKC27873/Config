##### PREFIX & KEYBINDINGS #####

# Change prefix from C-b to C-x
unbind C-b
set -g prefix C-x
bind C-x send-prefix

# Split panes (keep current path)
bind v split-window -h -c "#{pane_current_path}"
bind h split-window -v -c "#{pane_current_path}"
unbind '"'
unbind '%'

# New window in same path
bind c new-window -c "#{pane_current_path}"

# Reload config
bind r source-file ~/.tmux.conf \; display-message "Reloaded ~/.tmux.conf"

# Pane navigation with Alt + hjkl
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

##### COPY / PASTE SETTINGS #####

# Vi style copy mode
setw -g mode-keys vi
unbind ]
bind [ copy-mode

# Vi copy mode bindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -i -selection clipboard"
bind-key -T copy-mode-vi Y send-keys -X copy-end-of-line

bind P paste-buffer


##### TERMINAL #####################################################
set -g mouse on
set -g status-position top
set -g status-interval 1
set -g renumber-windows on
set-option -g automatic-rename off
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

##### Color and Status Bar #####################################################
source-file "~/.config/tmux/plugins/tmux-themepack/basic.tmuxtheme"

# CATPPUCCIN MOCHA STATUS BAR
set -g status-style "fg=#CDD6F4,bg=#1E1E2E"
# Left and right sections
set -g status-left-style "fg=#89DCEB,bg=#1E1E2E"
set -g status-right-style "fg=#A6ADC8,bg=#1E1E2E"
# Inactive windows
set -g window-status-style "fg=#A6ADC8,bg=#1E1E2E"
# Active window - Lavender
set -g window-status-current-style "fg=#1E1E2E,bg=#CBA6F7,bold"
# Previously active window
set -g window-status-last-style "fg=#CBA6F7,bg=#313244"
# Activity and alerts
set -g window-status-activity-style "fg=#F9E2AF,bg=#313244,bold"
set -g window-status-bell-style "fg=#1E1E2E,bg=#F38BA8,bold"
# Window separators
set -g window-status-separator " #[fg=#45475A]│#[default] "
# Catppuccin Mocha window chooser (Ctrl+x, w)
set -g mode-style "fg=#1E1E2E,bg=#CBA6F7,bold"
# Keep copy-mode selection independently styled
set -g copy-mode-selection-style "fg=#F5C2E7,bg=terminal"


##### PLUGINS ######################################################
set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-yank"
##### TPM — KEEP LAST ###############################################
run '~/.tmux/plugins/tpm/tpm'
