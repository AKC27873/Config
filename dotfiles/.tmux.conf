##### PREFIX & KEYBINDINGS #####

# Change prefix from C-b to C-x
unbind C-b
set -g prefix C-x
bind C-x send-prefix

# Split panes (keep current path)
bind v split-window -h -c "#{pane_current_path}"
bind h split-window -v -c "#{pane_current_path}"
unbind '"'
unbind '%'

# New window in same path
bind c new-window -c "#{pane_current_path}"

# Reload config
bind r source-file ~/.tmux.conf \; display-message "Reloaded ~/.tmux.conf"

# Pane navigation with Alt + hjkl
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

##### COPY / PASTE SETTINGS #####

# Vi style copy mode
setw -g mode-keys vi
unbind ]
bind [ copy-mode

# Vi copy mode bindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -i -selection clipboard"
bind-key -T copy-mode-vi Y send-keys -X copy-end-of-line

bind P paste-buffer

#--- Nord muted status bar overrides ---
set -g status-style 'bg=#2E3440,fg=#D8DEE9'


# Left side: session name + hostname
set -g status-left '#[fg=#81A1C1,bold] #S #[fg=#4C566A]│ #[fg=#D8DEE9]#H #[fg=#4C566A]│ '
set -g status-left-length 40

# Right side: time with seconds + date
set -g status-right '#[fg=#4C566A]│ #[fg=#D8DEE9]%H:%M:%S #[fg=#4C566A]│ #[fg=#81A1C1]%Y-%m-%d '

# Inactive windows: subdued gray
setw -g window-status-style 'fg=#616E88,bg=#2E3440'
setw -g window-status-format ' #I:#W '

# Active window: pale blue-gray, NOT mint green
setw -g window-status-current-style 'fg=#ECEFF4,bg=#3B4252,bold'
setw -g window-status-current-format ' #I:#W '

# Subtle pane borders
set -g pane-border-style 'fg=#3B4252'
set -g pane-active-border-style 'fg=#81A1C1'

##### TERMINAL #####################################################

set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

set -g mouse on
set -g status-position top
set -g status-interval 1
set -g renumber-windows on
set-option -g automatic-rename off

##### PLUGINS ######################################################
set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-yank"
##### TPM — KEEP LAST ###############################################

# Initialize TPM (keep at bottom)
# source-file "~/.config/tmux/plugins/tmux-themepack/basic.tmuxtheme"
run '~/.tmux/plugins/tpm/tpm'
