##### PREFIX & KEYBINDINGS #####

# Change prefix from C-b to C-x
unbind C-b
set -g prefix C-x
bind C-x send-prefix

# Split panes (keep current path)
bind v split-window -h -c "#{pane_current_path}"
bind h split-window -v -c "#{pane_current_path}"
unbind '"'
unbind '%'

# New window in same path
bind c new-window -c "#{pane_current_path}"

# Reload config
bind r source-file ~/.tmux.conf \; display-message "Reloaded ~/.tmux.conf"

# Pane navigation with Alt + hjkl
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

##### COPY / PASTE SETTINGS #####

# Vi style copy mode
setw -g mode-keys vi
unbind ]
bind [ copy-mode

# Vi copy mode bindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -i -selection clipboard"
bind-key -T copy-mode-vi Y send-keys -X copy-end-of-line

bind P paste-buffer

##### TERMINAL #####################################################

set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

set -g mouse on
set -g status-position top
set -g status-interval 5
set -g renumber-windows on

setw -g allow-rename on
setw -g automatic-rename off


##### PLUGINS ######################################################

set -g @plugin "tmux-plugins/tpm"
set -g @plugin "catppuccin/tmux#v2.3.0"
set -g @plugin "tmux-plugins/tmux-yank"
set -g @plugin "tmux-plugins/tmux-resurrect"
set -g @plugin "tmux-plugins/tmux-cpu"
set -g @plugin "tmux-plugins/tmux-battery"


##### RESURRECT ####################################################

set -g @resurrect-dir "~/.config/tmux/resurrect"
set -g @resurrect-strategy-nvim "session"



##### STATUS LINE ##################################################

set -g status-left-length 50
set -g status-right-length 120

set -g status-left ""

##### RELOAD BINDING ###############################################

unbind r
bind r source-file ~/.config/tmux/tmux.conf \
    \; display-message "tmux.conf reloaded"


##### RESURRECT BINDINGS ###########################################

bind-key C-r run-shell \
    "~/.config/tmux/plugins/tmux-resurrect/scripts/restore.sh"

bind-key C-s run-shell \
    "~/.config/tmux/plugins/tmux-resurrect/scripts/save.sh"


##### TPM — MUST BE LAST ###########################################

run "~/.config/tmux/plugins/tpm/tpm"
##### RELOAD BINDING ################################################

bind r source-file ~/.config/tmux/tmux.conf \
    \; display-message "tmux.conf reloaded"


##### TPM — KEEP LAST ###############################################

run-shell "~/.config/tmux/plugins/tpm/tpm"

# Initialize TPM (keep at bottom)
source-file "~/.config/tmux/plugins/tmux-themepack/powerline/default/yellow.tmuxtheme"
run '~/.tmux/plugins/tpm/tpm'
bind-key C-r run-shell ~/.tmux/plugins/tmux-resurrect/scripts/restore.sh
bind-key C-s run-shell ~/.tmux/plugins/tmux-resurrect/scripts/save.sh
